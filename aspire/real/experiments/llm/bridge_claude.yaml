# @package _global_
# Default LLM backend — routes each step's generation through the local
# Claude Code CLI via the agent bridge. Respects stage-specific system
# prompts (skill_author.md, assembly_generator.md, etc.) set by the
# pipeline.
#
# Requirements:
#   - `claude` CLI installed and logged in.
#   - cap_agent.py bridge running (launched automatically by run_agent.py).

llm:
  backend: "bridge:claude_code"
  model: null  # use provider default
